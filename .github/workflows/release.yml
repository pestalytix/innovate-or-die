name: release

# Tag-driven, and deliberately separate from check.yml. check.yml guards every
# push; this runs once per tag and is the only thing that publishes. Editing one
# must not be able to break the other.
on:
  push:
    tags: ['v*']

# The default GITHUB_TOKEN is read-only; uploading release assets needs write.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The same two gates check.yml runs, repeated here on purpose: a tag can
      # be pushed at a commit whose check run never finished, or was skipped,
      # and a release is the one build where "probably green" is not enough.
      - name: Generated trees match core/
        run: python3 build/assemble.py --check

      - name: Install pytest
        run: pip install pytest

      - name: Harness unit tests
        run: python -m pytest -q

      # The asset filenames carry the version from core/skill-meta.json, not the
      # tag. If the two disagree, tag v2.2.0 ships innovate-or-die-skill-v2.1.0.zip
      # and every download link in the README points at a file that is not there.
      - name: Tag matches core/skill-meta.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          meta=$(python3 -c "import json;print(json.load(open('core/skill-meta.json'))['version'])")
          if [ "$tag" != "$meta" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match core/skill-meta.json version $meta"
            exit 1
          fi

      # Packages from HEAD via git archive; asserts all three zip layouts and
      # runs build/validate_openai.py against the finished plugin asset, exiting
      # 1 on any mismatch -- so neither a wrong-rooted asset nor an unsubmittable
      # listing can reach the release. Both run without --check, which is why
      # package.py runs them on every build and not only in verification mode.
      - name: Build release assets
        run: python3 build/package.py

      # gh CLI rather than a third-party action. Two reasons, both about the
      # write-scoped token this job carries: no external code receives it, and
      # there is no pinned third-party SHA to re-audit every time it moves.
      # gh is preinstalled on GitHub-hosted runners, so this adds no setup.
      #
      # Create-or-upload, because both orders happen: a release drafted in the
      # web UI creates the tag (release already exists -- upload into it, and
      # leave the hand-written notes alone), while `git push --tags` does not
      # (create it first). --clobber makes a re-run idempotent instead of
      # failing on an asset that is already there.
      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            "dist/innovate-or-die-skill-v${TAG#v}.zip" \
            "dist/innovate-or-die-skill-flat-v${TAG#v}.zip" \
            "dist/innovate-or-die-openai-v${TAG#v}.zip" \
            --clobber
